  /* =============================================================
     KEYBOARD SHORTCUTS
     ============================================================= */
  document.addEventListener('keydown', e => {
    const ta = getEditor();
    if (e.target !== ta) return;

    if (e.key === 'Tab') {
      e.preventDefault();
      const s = ta.selectionStart, en = ta.selectionEnd;
      ta.value = ta.value.slice(0, s) + '  ' + ta.value.slice(en);
      ta.selectionStart = ta.selectionEnd = s + 2;
      updatePreview();
      return;
    }

    if (e.ctrlKey || e.metaKey) {
      switch (e.key) {
        case 'b': e.preventDefault(); wrapSel('**','**'); break;
        case 'i': e.preventDefault(); wrapSel('*','*'); break;
        case 'k': e.preventDefault(); insertLink(); break;
        case 's': e.preventDefault(); saveToStorage(); break;
      }
    }
  });

  /* =============================================================
     FILE DROP
     ============================================================= */
  const ta = getEditor();
  ta.addEventListener('dragover', e => { e.preventDefault(); ta.style.background = 'var(--bg-subtle)'; });
  ta.addEventListener('dragleave', () => { ta.style.background = ''; });
  ta.addEventListener('drop', e => {
    e.preventDefault(); ta.style.background = '';
    const file = e.dataTransfer.files[0];
    if (file && (file.type === 'text/markdown' || file.name.endsWith('.md') || file.name.endsWith('.txt'))) {
      const reader = new FileReader();
      reader.onload = ev => { ta.value = ev.target.result; updatePreview(); showToast('File loaded'); };
      reader.readAsText(file);
    }
  });

  /* Paste image */
  document.addEventListener('paste', e => {
    for (const item of e.clipboardData.items) {
      if (item.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = ev => { insertMarkdown(`![pasted image](${ev.target.result})`); showToast('Image pasted'); };
        reader.readAsDataURL(item.getAsFile());
        break;
      }
    }
  });

  /* =============================================================
     PANEL RESIZER (drag to resize editor/preview split)
     ============================================================= */
  (function initResizer() {
    const resizer = document.getElementById('resizer');
    const left = document.getElementById('panel-editor');
    const right = document.getElementById('panel-preview');
    const workspace = document.querySelector('.workspace');
    if (!resizer || !left || !right || !workspace) return;

    const MIN_PX = 220; // minimum width for either panel

    function applyRatio(ratio) {
      ratio = Math.max(0.05, Math.min(0.95, ratio));
      left.style.flex = `${ratio} 1 0`;
      right.style.flex = `${1 - ratio} 1 0`;
    }

    function currentUsableWidth() {
      const rect = workspace.getBoundingClientRect();
      const resizerWidth = resizer.getBoundingClientRect().width;
      return rect.width - resizerWidth;
    }

    function loadRatio() {
      try {
        const r = parseFloat(localStorage.getItem('md_panel_ratio'));
        if (r && r > 0.05 && r < 0.95) applyRatio(r);
      } catch (e) {}
    }

    function saveRatio(ratio) {
      try { localStorage.setItem('md_panel_ratio', ratio); } catch (e) {}
    }

    let dragging = false;

    resizer.addEventListener('pointerdown', e => {
      dragging = true;
      resizer.setPointerCapture(e.pointerId);
      resizer.classList.add('dragging');
      document.body.classList.add('resizing');
    });

    resizer.addEventListener('pointermove', e => {
      if (!dragging) return;
      const rect = workspace.getBoundingClientRect();
      const usable = currentUsableWidth();
      let x = e.clientX - rect.left;
      x = Math.max(MIN_PX, Math.min(usable - MIN_PX, x));
      applyRatio(x / usable);
    });

    function stopDrag() {
      if (!dragging) return;
      dragging = false;
      resizer.classList.remove('dragging');
      document.body.classList.remove('resizing');
      const usable = currentUsableWidth();
      const ratio = left.getBoundingClientRect().width / usable;
      saveRatio(ratio);
    }

    resizer.addEventListener('pointerup', stopDrag);
    resizer.addEventListener('pointercancel', stopDrag);
    resizer.addEventListener('lostpointercapture', stopDrag);

    resizer.addEventListener('keydown', e => {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      e.preventDefault();
      const usable = currentUsableWidth();
      let ratio = left.getBoundingClientRect().width / usable;
      ratio += (e.key === 'ArrowRight' ? 1 : -1) * 0.02;
      applyRatio(ratio);
      saveRatio(Math.max(0.05, Math.min(0.95, ratio)));
    });

    resizer.addEventListener('dblclick', () => {
      applyRatio(0.5);
      saveRatio(0.5);
    });

    loadRatio();
  })();

  /* =============================================================
     INIT
     ============================================================= */
  document.addEventListener('DOMContentLoaded', () => {
    try {
      const t = localStorage.getItem('md_theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
      document.getElementById('theme-knob').textContent = t === 'dark' ? '🌙' : '☀️';
      if (t === 'dark') document.getElementById('hljs-theme').href =
        'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css';
    } catch(e) {}

    loadFromStorage();
    initTextSizes();

    document.getElementById('editor').addEventListener('input', updatePreview);

    const editorEl = document.getElementById('editor');
    const previewEl = document.getElementById('preview');
    editorEl.addEventListener('scroll', () => syncScrollFrom(editorEl, previewEl));
    previewEl.addEventListener('scroll', () => syncScrollFrom(previewEl, editorEl));
    try {
      if (localStorage.getItem('md_sync_scroll') === '1') {
        syncScrollEnabled = true;
        document.getElementById('sync-scroll-btn').classList.add('btn-toggle-active');
      }
    } catch(e) {}

    setInterval(() => { try { localStorage.setItem('md_content', getEditor().value); } catch(e) {} }, 10000);

    const mq = window.matchMedia('(max-width: 960px)');
    mq.addEventListener('change', () => {});
  });
