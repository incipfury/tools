<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guitar Theory Bench</title>
<style>
:root{
  --paper:#f8f7f3; --card:#fffefa; --ink:#163960; --ink-soft:#5d6e80;
  --blue:#1369b3; --orange:#ff8a3d; --teal:#2ba1a1; --violet:#7a5cc4; --red:#c8503f;
  --rule:rgba(22,57,96,.22); --rule2:rgba(22,57,96,.45);
  --hand:"Segoe Print","Bradley Hand","Chalkboard SE","Comic Sans MS",system-ui,sans-serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono","SF Mono","Segoe UI Mono",Menlo,Consolas,monospace;
  --hand-radius:255px 15px 225px 15px/15px 225px 15px 255px;
  --hand-radius2:15px 225px 15px 255px/225px 15px 255px 15px;
  --shadow:2px 3px 0 rgba(22,57,96,.10);
}
body.clean{
  --paper:#ffffff; --card:#ffffff; --hand:var(--sans);
  --hand-radius:4px; --hand-radius2:4px; --shadow:none;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans);
  font-size:15px; line-height:1.55; -webkit-text-size-adjust:100%;
}
body.sketch{
  background-image:
    linear-gradient(rgba(19,105,179,.055) 1px,transparent 1px),
    linear-gradient(90deg,rgba(19,105,179,.055) 1px,transparent 1px);
  background-size:24px 24px;
}
#defs{position:absolute;width:0;height:0;overflow:hidden}
body.sketch .rough{filter:url(#roughen)}

/* ---------- header ---------- */
header{
  border-bottom:2px solid var(--ink); background:var(--card);
  padding:14px 20px 12px; display:flex; gap:16px; align-items:baseline; flex-wrap:wrap;
}
.topbar{position:sticky;top:0;z-index:40}
header h1{font-family:var(--hand); font-size:26px; margin:0; letter-spacing:.2px}
header .sub{font-size:13px;color:var(--ink-soft);flex:1;min-width:180px}
header .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------- tabs ---------- */
nav{
  background:var(--card); border-bottom:2px solid var(--ink);
  display:flex; gap:6px; padding:8px 14px; overflow-x:auto;
}
nav button{
  font-family:var(--hand); font-size:15px; white-space:nowrap; cursor:pointer;
  background:transparent; color:var(--ink); border:2px solid transparent;
  padding:6px 14px; border-radius:var(--hand-radius);
}
nav button:hover{border-color:var(--rule);background:rgba(19,105,179,.06)}
nav button[aria-selected="true"]{
  border-color:var(--ink); background:rgba(255,138,61,.16); box-shadow:var(--shadow);
}
main{max-width:1180px;margin:0 auto;padding:22px 18px 90px}
section[role="tabpanel"][hidden]{display:none}

/* ---------- structure ---------- */
h2{font-family:var(--hand);font-size:24px;margin:6px 0 4px}
h3{font-family:var(--hand);font-size:19px;margin:22px 0 8px;display:flex;align-items:center;gap:10px}
h3::after{content:"";flex:1;height:2px;background:var(--rule);border-radius:2px}
h4{font-family:var(--hand);font-size:16px;margin:16px 0 6px}
p{margin:6px 0 10px;max-width:76ch}
.lede{color:var(--ink-soft);font-size:14px;max-width:80ch;margin-bottom:14px}
.card{
  background:var(--card); border:2px solid var(--ink); border-radius:var(--hand-radius);
  padding:14px 16px; margin:14px 0; box-shadow:var(--shadow);
}
.card.alt{border-radius:var(--hand-radius2)}
.card.tint{background:rgba(43,161,161,.07)}
.card.warn{background:rgba(255,138,61,.10)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(310px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.scroll{overflow-x:auto;padding-bottom:6px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}

/* ---------- controls ---------- */
.controls{
  display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;
  border:2px dashed var(--rule2);border-radius:var(--hand-radius);padding:10px 12px;margin:10px 0 16px;
  background:var(--card);
}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-family:var(--hand);font-size:12px;letter-spacing:.4px;color:var(--ink-soft);text-transform:uppercase}
select,input[type=text]{
  font-family:var(--sans);font-size:15px;color:var(--ink);background:var(--card);
  border:2px solid var(--ink);border-radius:6px;padding:5px 8px;min-width:92px;
}
input[type=range]{accent-color:var(--blue);width:170px}
button.btn{
  font-family:var(--hand);font-size:14px;cursor:pointer;background:var(--card);color:var(--ink);
  border:2px solid var(--ink);border-radius:var(--hand-radius);padding:5px 13px;box-shadow:var(--shadow);
}
button.btn:hover{background:rgba(19,105,179,.10)}
button.btn:active{transform:translate(1px,1px)}
button.btn.on{background:var(--ink);color:var(--card)}
button.btn.play{background:rgba(255,138,61,.2)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  font-family:var(--hand);font-size:13px;cursor:pointer;background:var(--card);color:var(--ink);
  border:2px solid var(--rule2);border-radius:var(--hand-radius);padding:3px 11px;
}
.chip[aria-pressed="true"]{border-color:var(--ink);background:rgba(19,105,179,.14)}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

/* ---------- tables ---------- */
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid var(--rule);padding:6px 9px;text-align:left;vertical-align:top}
th{font-family:var(--hand);font-weight:600;background:rgba(19,105,179,.09);font-size:13.5px;
   letter-spacing:.3px;position:sticky;top:0}
tbody tr:nth-child(even){background:rgba(22,57,96,.035)}
td.n,th.n{text-align:center;white-space:nowrap}
.note{font-weight:600;font-variant-numeric:tabular-nums}
.rn{font-family:var(--mono);font-weight:600;color:var(--blue)}
.nash{font-family:var(--mono);font-weight:600;color:var(--orange)}
code,kbd,pre{font-family:var(--mono)}
pre.tab{
  background:var(--card);border:2px solid var(--ink);border-radius:var(--hand-radius);
  padding:10px 12px;font-size:13px;line-height:1.45;overflow-x:auto;margin:8px 0;box-shadow:var(--shadow);
}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin:8px 0 4px;align-items:center}
.legend i{width:14px;height:14px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:-2px;border:1.5px solid var(--ink)}
.sw-root{background:var(--orange)} .sw-third{background:var(--teal)} .sw-fifth{background:var(--blue)}
.sw-seventh{background:var(--violet)} .sw-other{background:#fff}
.pill{font-family:var(--hand);font-size:12px;border:2px solid var(--rule2);border-radius:20px;padding:1px 9px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:14px}
.kv dt{font-family:var(--hand);color:var(--ink-soft)}
.kv dd{margin:0;font-weight:600}
.big{font-family:var(--hand);font-size:30px;line-height:1.15}
.muted{color:var(--ink-soft)}
.small{font-size:13px}
svg{max-width:100%;height:auto;display:block}
svg text{font-family:var(--sans)}
body.sketch svg text.h{font-family:var(--hand)}
.diagwrap{margin:10px 0}
.diagwrap .cap{font-family:var(--hand);font-size:14px;margin-bottom:2px}
.fbwrap{overflow-x:auto}
ul.tight{margin:6px 0;padding-left:20px} ul.tight li{margin:3px 0}
.foot{border-top:2px solid var(--rule);margin-top:34px;padding-top:12px;font-size:13px;color:var(--ink-soft)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  nav,header .tools,.controls button,#topbtn{display:none!important}
  section[role="tabpanel"][hidden]{display:block!important}
  body{background:#fff}
  .card{break-inside:avoid}
}
@media (max-width:640px){
  header{padding:10px 12px} header h1{font-size:21px}
  main{padding:16px 10px 70px}
}
</style>
</head>
<body class="clean">
<div id="defs" aria-hidden="true">
<svg xmlns="http://www.w3.org/2000/svg">
 <filter id="roughen">
  <feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="3" seed="9" result="n"/>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7" xChannelSelector="R" yChannelSelector="G"/>
 </filter>
</svg>
</div>

<div class="topbar">
<header>
  <h1>Guitar Theory Bench</h1>
  <div class="sub">Keys, chords, scales, notation and rhythm &mdash; drawn out, not just listed. Works offline.</div>
  <div class="tools">
    <button class="btn" id="styleToggle" title="Switch between marker-sketch and clean line work">Clean style</button>
    <button class="btn" id="soundToggle" title="Turn the built-in tone generator on or off">Sound: on</button>
  </div>
</header>

<nav id="tabs" role="tablist" aria-label="Sections">
  <button role="tab" data-tab="keys" aria-selected="true">Keys</button>
  <button role="tab" data-tab="chords" aria-selected="false">Chords</button>
  <button role="tab" data-tab="scales" aria-selected="false">Scales</button>
  <button role="tab" data-tab="pent" aria-selected="false">Pentatonic &amp; Blues</button>
  <button role="tab" data-tab="fretboard" aria-selected="false">Fretboard &amp; CAGED</button>
  <button role="tab" data-tab="notation" aria-selected="false">Notation</button>
  <button role="tab" data-tab="rhythm" aria-selected="false">Rhythm &amp; Time</button>
  <button role="tab" data-tab="detective" aria-selected="false">Key Detective</button>
  <button role="tab" data-tab="modulate" aria-selected="false">Modulate</button>
  <button role="tab" data-tab="reference" aria-selected="false">Reference</button>
</nav>
</div>

<main>
  <section role="tabpanel" id="panel-keys" aria-label="Keys"></section>
  <section role="tabpanel" id="panel-chords" aria-label="Chords" hidden></section>
  <section role="tabpanel" id="panel-scales" aria-label="Scales" hidden></section>
  <section role="tabpanel" id="panel-pent" aria-label="Pentatonic and blues" hidden></section>
  <section role="tabpanel" id="panel-fretboard" aria-label="Fretboard and CAGED" hidden></section>
  <section role="tabpanel" id="panel-notation" aria-label="Notation" hidden></section>
  <section role="tabpanel" id="panel-rhythm" aria-label="Rhythm and time" hidden></section>
  <section role="tabpanel" id="panel-detective" aria-label="Key Detective" hidden></section>
  <section role="tabpanel" id="panel-modulate" aria-label="Modulate" hidden></section>
  <section role="tabpanel" id="panel-reference" aria-label="Reference" hidden></section>
  <div class="foot">Single file, no network, no dependencies. Everything here is generated from interval math, so any key you pick is spelled correctly &mdash; double flats and all.</div>
</main>

<script>
"use strict";
/* ============================================================
   1. THEORY CORE
   ============================================================ */
const LETTERS=["C","D","E","F","G","A","B"];
const LETTER_PC={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const MAJ_DEG_SEMI={1:0,2:2,3:4,4:5,5:7,6:9,7:11,9:14,11:17,13:21};
const SHARP_NAMES=["C","C\u266f","D","D\u266f","E","F","F\u266f","G","G\u266f","A","A\u266f","B"];
const FLAT_NAMES =["C","D\u266d","D","E\u266d","E","F","G\u266d","G","A\u266d","A","B\u266d","B"];

function mod(n,m){return ((n%m)+m)%m;}
function accStr(a){return a>0?"\u266f".repeat(a):a<0?"\u266d".repeat(-a):"";}
function parseNote(name){
  const letter=name[0].toUpperCase();
  let acc=0;
  for(const ch of name.slice(1)){
    if(ch==="#"||ch==="\u266f")acc++;
    else if(ch==="b"||ch==="\u266d")acc--;
  }
  return {letter:letter,acc:acc,pc:mod(LETTER_PC[letter]+acc,12),name:letter+accStr(acc)};
}
/* spell a note a given scale-degree + semitone distance above a root */
function spell(root,degree,semi){
  const li=mod(LETTERS.indexOf(root.letter)+(degree-1),7);
  const letter=LETTERS[li];
  const target=mod(root.pc+semi,12);
  let acc=mod(target-LETTER_PC[letter],12);
  if(acc>6)acc-=12;
  return {letter:letter,acc:acc,pc:target,name:letter+accStr(acc)};
}
function degLabel(degree,semi){
  const d=semi-MAJ_DEG_SEMI[degree];
  const p=d===0?"":d===-1?"\u266d":d===1?"\u266f":d===-2?"\u266d\u266d":d===2?"\u266f\u266f":(d>0?"+"+d:String(d));
  return p+degree;
}
/* --- scale formulas: [scaleDegree, semitones] --- */
const SCALES={
  major:{name:"Major (Ionian)",deg:[[1,0],[2,2],[3,4],[4,5],[5,7],[6,9],[7,11]],
    mood:"Home base. Bright, resolved, the reference every other scale is described against."},
  natural_minor:{name:"Natural minor (Aeolian)",deg:[[1,0],[2,2],[3,3],[4,5],[5,7],[6,8],[7,10]],
    mood:"Dark but relaxed. No leading tone, so it never pulls hard to the root."},
  harmonic_minor:{name:"Harmonic minor",deg:[[1,0],[2,2],[3,3],[4,5],[5,7],[6,8],[7,11]],
    mood:"Minor with a raised 7th so V becomes a real dominant. Gap between \u266d6 and 7 gives the exotic edge."},
  melodic_minor:{name:"Melodic minor (ascending)",deg:[[1,0],[2,2],[3,3],[4,5],[5,7],[6,9],[7,11]],
    mood:"Minor 3rd with a major-scale top. Jazz minor: the parent of altered and lydian dominant."},
  dorian:{name:"Dorian",deg:[[1,0],[2,2],[3,3],[4,5],[5,7],[6,9],[7,10]],
    mood:"Minor with a natural 6th. Hopeful minor. Santana, Miles, most minor funk vamps."},
  phrygian:{name:"Phrygian",deg:[[1,0],[2,1],[3,3],[4,5],[5,7],[6,8],[7,10]],
    mood:"\u266d2 gives the Spanish/metal darkness."},
  lydian:{name:"Lydian",deg:[[1,0],[2,2],[3,4],[4,6],[5,7],[6,9],[7,11]],
    mood:"Major with a \u266f4. Floating, cinematic, unresolved brightness."},
  mixolydian:{name:"Mixolydian",deg:[[1,0],[2,2],[3,4],[4,5],[5,7],[6,9],[7,10]],
    mood:"Major with a \u266d7. The dominant-7th sound: blues, rock, country."},
  locrian:{name:"Locrian",deg:[[1,0],[2,1],[3,3],[4,5],[5,6],[6,8],[7,10]],
    mood:"\u266d5 kills the tonic. Used over m7\u266d5 chords, rarely as a key."},
  major_pent:{name:"Major pentatonic",deg:[[1,0],[2,2],[3,4],[5,7],[6,9]],
    mood:"Major scale minus the two half-steps. Nothing can clash."},
  minor_pent:{name:"Minor pentatonic",deg:[[1,0],[3,3],[4,5],[5,7],[7,10]],
    mood:"The rock/blues default. Five notes, five boxes, whole neck."},
  blues_minor:{name:"Minor blues",deg:[[1,0],[3,3],[4,5],[5,6],[5,7],[7,10]],
    mood:"Minor pentatonic plus the \u266d5 passing tone. Land on it, don't sit on it."},
  blues_major:{name:"Major blues",deg:[[1,0],[2,2],[3,3],[3,4],[5,7],[6,9]],
    mood:"Major pentatonic plus the \u266d3. The country/Allmans sound."},
  mixo_b6:{name:"Mixolydian \u266d6",deg:[[1,0],[2,2],[3,4],[4,5],[5,7],[6,8],[7,10]],
    mood:"Dominant with a dark top. Good over V7 heading to minor."},
  lydian_dom:{name:"Lydian dominant",deg:[[1,0],[2,2],[3,4],[4,6],[5,7],[6,9],[7,10]],
    mood:"7\u266f11 sound. Melodic minor's 4th mode."},
  altered:{name:"Altered (super-locrian)",deg:[[1,0],[2,1],[3,3],[4,4],[5,6],[6,8],[7,10]],
    mood:"Every tension altered. Melodic minor a half-step above the chord root."},
  whole_tone:{name:"Whole tone",deg:[[1,0],[2,2],[3,4],[4,6],[5,8],[6,10]],
    mood:"All whole steps. Dreamlike, no resolution. Fits 7\u266f5."},
  dim_hw:{name:"Half-whole diminished",deg:[[1,0],[2,1],[3,3],[3,4],[4,6],[5,7],[6,9],[7,10]],
    mood:"Symmetrical. Every altered tension a dominant chord could want."}
};
function buildScale(rootName,scaleId){
  const root=parseNote(rootName), def=SCALES[scaleId];
  return def.deg.map(function(d){
    const n=spell(root,d[0],d[1]);
    n.deg=degLabel(d[0],d[1]); n.semi=d[1];
    return n;
  });
}
const DEGREE_NAMES=["Tonic","Supertonic","Mediant","Subdominant","Dominant","Submediant","Leading tone"];
const DEGREE_NAMES_MIN=["Tonic","Supertonic","Mediant","Subdominant","Dominant","Submediant","Subtonic"];

/* --- chord formulas --- */
const CHORDS=[
 {id:"maj",sym:"",label:"Major",deg:[[1,0],[3,4],[5,7]],group:"Triads",use:"The I, IV and V of a major key."},
 {id:"min",sym:"m",label:"Minor",deg:[[1,0],[3,3],[5,7]],group:"Triads",use:"The ii, iii and vi of a major key."},
 {id:"dim",sym:"\u00b0",label:"Diminished",deg:[[1,0],[3,3],[5,6]],group:"Triads",use:"vii\u00b0. Unstable, wants to resolve up a half step."},
 {id:"aug",sym:"+",label:"Augmented",deg:[[1,0],[3,4],[5,8]],group:"Triads",use:"Passing chord, often V+ into I."},
 {id:"sus4",sym:"sus4",label:"Suspended 4th",deg:[[1,0],[4,5],[5,7]],group:"Triads",use:"No 3rd. Neither major nor minor; usually falls to the 3rd."},
 {id:"sus2",sym:"sus2",label:"Suspended 2nd",deg:[[1,0],[2,2],[5,7]],group:"Triads",use:"Open, ringing. Very guitar-friendly."},
 {id:"5",sym:"5",label:"Power chord",deg:[[1,0],[5,7]],group:"Triads",use:"Root and 5th only. Neutral, survives distortion."},
 {id:"6",sym:"6",label:"Major 6th",deg:[[1,0],[3,4],[5,7],[6,9]],group:"Sixths &amp; sevenths",use:"Softer substitute for a major triad ending."},
 {id:"m6",sym:"m6",label:"Minor 6th",deg:[[1,0],[3,3],[5,7],[6,9]],group:"Sixths &amp; sevenths",use:"Dorian flavour. Common in jazz and bossa."},
 {id:"69",sym:"6/9",label:"Six-nine",deg:[[1,0],[3,4],[5,7],[6,9],[9,14]],group:"Sixths &amp; sevenths",use:"Lush final chord with no leading-tone tension."},
 {id:"maj7",sym:"maj7",label:"Major 7th",deg:[[1,0],[3,4],[5,7],[7,11]],group:"Sixths &amp; sevenths",use:"Imaj7 and IVmaj7. Warm, at rest."},
 {id:"7",sym:"7",label:"Dominant 7th",deg:[[1,0],[3,4],[5,7],[7,10]],group:"Sixths &amp; sevenths",use:"V7. The tritone between 3 and \u266d7 is what pulls home."},
 {id:"m7",sym:"m7",label:"Minor 7th",deg:[[1,0],[3,3],[5,7],[7,10]],group:"Sixths &amp; sevenths",use:"ii7, iii7, vi7. The workhorse minor."},
 {id:"mMaj7",sym:"m(maj7)",label:"Minor-major 7th",deg:[[1,0],[3,3],[5,7],[7,11]],group:"Sixths &amp; sevenths",use:"Tonic chord of harmonic minor. James Bond."},
 {id:"m7b5",sym:"m7\u266d5",label:"Half-diminished",deg:[[1,0],[3,3],[5,6],[7,10]],group:"Sixths &amp; sevenths",use:"ii\u00f87 of a minor key. Written \u00f87 as well."},
 {id:"dim7",sym:"\u00b07",label:"Diminished 7th",deg:[[1,0],[3,3],[5,6],[7,9]],group:"Sixths &amp; sevenths",use:"Stack of minor 3rds. Any note can be the root."},
 {id:"7sus4",sym:"7sus4",label:"Dominant 7 sus4",deg:[[1,0],[4,5],[5,7],[7,10]],group:"Sixths &amp; sevenths",use:"Delays the V7 resolution. Huge in gospel and 70s rock."},
 {id:"add9",sym:"add9",label:"Add 9",deg:[[1,0],[3,4],[5,7],[9,14]],group:"Extensions",use:"Triad plus a 9th, no 7th. Jangly."},
 {id:"madd9",sym:"m(add9)",label:"Minor add 9",deg:[[1,0],[3,3],[5,7],[9,14]],group:"Extensions",use:"Minor triad plus 9. Bittersweet."},
 {id:"9",sym:"9",label:"Dominant 9th",deg:[[1,0],[3,4],[5,7],[7,10],[9,14]],group:"Extensions",use:"Funk chord. Stevie Wonder, James Brown."},
 {id:"maj9",sym:"maj9",label:"Major 9th",deg:[[1,0],[3,4],[5,7],[7,11],[9,14]],group:"Extensions",use:"maj7 with more air."},
 {id:"m9",sym:"m9",label:"Minor 9th",deg:[[1,0],[3,3],[5,7],[7,10],[9,14]],group:"Extensions",use:"Smooth minor. Neo-soul default."},
 {id:"11",sym:"11",label:"Dominant 11th",deg:[[1,0],[5,7],[7,10],[9,14],[11,17]],group:"Extensions",use:"3rd usually dropped because 11 clashes with it."},
 {id:"m11",sym:"m11",label:"Minor 11th",deg:[[1,0],[3,3],[5,7],[7,10],[9,14],[11,17]],group:"Extensions",use:"Stack of fourths feel. Modal jazz."},
 {id:"13",sym:"13",label:"Dominant 13th",deg:[[1,0],[3,4],[5,7],[7,10],[9,14],[13,21]],group:"Extensions",use:"Full dominant. 11 is normally omitted."},
 {id:"maj13",sym:"maj13",label:"Major 13th",deg:[[1,0],[3,4],[5,7],[7,11],[9,14],[13,21]],group:"Extensions",use:"Biggest at-rest chord in common use."},
 {id:"m13",sym:"m13",label:"Minor 13th",deg:[[1,0],[3,3],[5,7],[7,10],[9,14],[13,21]],group:"Extensions",use:"Dorian colour on a minor chord."},
 {id:"7b9",sym:"7\u266d9",label:"Dominant 7\u266d9",deg:[[1,0],[3,4],[5,7],[7,10],[9,13]],group:"Altered dominants",use:"V7 into a minor i. Contains a hidden dim7."},
 {id:"7s9",sym:"7\u266f9",label:"Dominant 7\u266f9",deg:[[1,0],[3,4],[5,7],[7,10],[9,15]],group:"Altered dominants",use:"The Hendrix chord. Major 3rd and \u266d3 at once."},
 {id:"7s11",sym:"7\u266f11",label:"Dominant 7\u266f11",deg:[[1,0],[3,4],[5,7],[7,10],[11,18]],group:"Altered dominants",use:"Lydian dominant. Bright tension."},

function fretboardSVG(notes,opts){

  let o='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" style="min-width:'+W+'px" role="img" aria-label="'+esc(opts.alt||"fretboard diagram")+'">';
  o+='<g class="rough">';

    o+='<line x1="'+xl(k)+'" y1="'+y(1)+'" x2="'+xl(k)+'" y2="'+y(6)+'" stroke="var(--ink)" stroke-width="'+(isNut?5:1.6)+'" stroke-linecap="round" opacity="'+(isNut?1:.55)+'"/>';

      o+='<circle cx="'+x(f)+'" cy="'+(y(4)+ss/2)+'" r="4.5" fill="var(--ink)" opacity=".16"/>';

    }

    o+='<text x="'+cx+'" y="'+(cy+3.5)+'" font-size="'+(String(txt).length>2?8.5:10)+'" font-weight="600" fill="'+degTextColor(n.deg)+'" text-anchor="middle"'+(n.dim?' opacity=".45"':'')+'>'+esc(txt)+'</text>';
    if(label==="both"&&!n.dim){
      o+='<text x="'+cx+'" y="'+(cy-14)+'" font-size="8.5" fill="var(--ink-soft)" text-anchor="middle">'+esc(n.deg)+'</text>';
    }

/* vertical chord box */
function chordBoxSVG(frets,opts){
  opts=opts||{};
  const played=frets.map(function(f,i){return {f:f,i:i};}).filter(function(o){return o.f!==null&&o.f>0;});
  let base=played.length?Math.min.apply(null,played.map(function(o){return o.f;})):1;
  let span=played.length?Math.max.apply(null,played.map(function(o){return o.f;}))-base+1:1;
  let start=(base<=4&&span<=4)?1:base;
  const rows=Math.max(4,Math.min(5,span+ (start===1?0:0)));
  const nR=Math.max(4,span<=4?4:span);
  const w=26, h=26, padL=26, padT=26, padR=16, padB=14;
  const W=padL+5*w+padR, H=padT+nR*h+padB;
  const sx=function(i){return padL+i*w;};              /* i: 0=string6 .. 5=string1 -> draw low E left */
  const fy=function(r){return padT+r*h;};
  let o='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" role="img" aria-label="'+esc(opts.alt||"chord diagram")+'">';
  o+='<g class="rough">';
  for(let i=0;i<6;i++)o+='<line x1="'+sx(i)+'" y1="'+padT+'" x2="'+sx(i)+'" y2="'+fy(nR)+'" stroke="var(--ink)" stroke-width="1.5" opacity=".7"/>';
  for(let r=0;r<=nR;r++){
    const nut=(start===1&&r===0);
    o+='<line x1="'+sx(0)+'" y1="'+fy(r)+'" x2="'+sx(5)+'" y2="'+fy(r)+'" stroke="var(--ink)" stroke-width="'+(nut?5:1.5)+'" opacity="'+(nut?1:.55)+'"/>';
  }
  o+='</g>';
  if(start>1)o+='<text class="h" x="'+(padL-10)+'" y="'+(padT+16)+'" font-size="12" fill="var(--ink-soft)" text-anchor="end">'+start+'fr</text>';
  /* barre */
  if(opts.barre){
    let first=-1,last=-1;
    frets.forEach(function(f,i){if(f===opts.barre){if(first<0)first=i;last=i;}});
    if(first>=0&&last>first){
      const r=opts.barre-start;
      o+='<rect x="'+(sx(first)-8)+'" y="'+(fy(r)+h/2-9)+'" width="'+(sx(last)-sx(first)+16)+'" height="18" rx="9" fill="var(--ink)" opacity=".85"/>';
    }
  }
  frets.forEach(function(f,i){
    const cx=sx(i);
    if(f===null){o+='<text x="'+cx+'" y="'+(padT-8)+'" font-size="13" fill="var(--ink-soft)" text-anchor="middle">\u2715</text>';return;}
    if(f===0){o+='<circle cx="'+cx+'" cy="'+(padT-13)+'" r="5.5" fill="none" stroke="var(--ink)" stroke-width="1.8"/>';return;}
    const r=f-start;
    const lab=opts.labels?opts.labels[i]:"";
    o+='<circle cx="'+cx+'" cy="'+(fy(r)+h/2)+'" r="9.5" fill="'+(opts.colors?opts.colors[i]:"var(--ink)")+'" stroke="var(--ink)" stroke-width="1.6"/>';
    if(lab)o+='<text x="'+cx+'" y="'+(fy(r)+h/2+3.5)+'" font-size="9" font-weight="600" fill="#fff" text-anchor="middle">'+esc(lab)+'</text>';
  });
  for(let i=0;i<6;i++)o+='<text class="h" x="'+sx(i)+'" y="'+(H-2)+'" font-size="10" fill="var(--ink-soft)" text-anchor="middle">'+STRING_LABELS[5-i]+'</text>';
  o+='</svg>';
  return o;
}

let AC=null, soundOn=true;
function actx(){

let RINGING=[];
function pluck(midi,when,dur,gain){
  if(!soundOn)return;
  const c=actx(); if(!c)return;
  dur=dur||1.5; gain=gain||0.14;
  const f=440*Math.pow(2,(midi-69)/12), t=c.currentTime+(when||0);
  [[1,1,"triangle"],[2,0.22,"sine"],[3,0.09,"sine"]].forEach(function(p){
    const o=c.createOscillator(),g=c.createGain();
    o.type=p[2]; o.frequency.value=f*p[0];
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(gain*p[1],t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+0.05);
    const rec={o:o,g:g};
    RINGING.push(rec);
    o.onended=function(){const i=RINGING.indexOf(rec); if(i>=0)RINGING.splice(i,1);};
  });
}
function stopAllNotes(){
  const c=AC; if(!c){RINGING=[];return;}
  const t=c.currentTime;
  RINGING.forEach(function(r){
    try{
      r.g.gain.cancelScheduledValues(t);
      r.g.gain.setValueAtTime(Math.max(r.g.gain.value,0.0001),t);
      r.g.gain.exponentialRampToValueAtTime(0.0001,t+0.04);
      r.o.stop(t+0.06);
    }catch(e){}
  });
  RINGING=[];
}
function playMidis(midis,spacing,dur){
  midis.forEach(function(m,i){pluck(m,i*(spacing===undefined?0.35:spacing),dur||1.6);});
}

function pcsToMidis(pcs,base){
  base=base===undefined?52:base; let last=base-1;
  return pcs.map(function(pc){let m=base+mod(pc-base,12); while(m<=last)m+=12; last=m; return m;});
}
function click(when,accent){
  if(!soundOn)return;
  const c=actx(); if(!c)return;
  const t=c.currentTime+when;
  const o=c.createOscillator(),g=c.createGain();
  o.type="square"; o.frequency.value=accent===2?1600:accent===1?1150:820;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(accent?0.22:0.11,t+0.002);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.055);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+0.08);
}

function voicings(rootName,typeId){
  const root=parseNote(rootName), notes=buildChord(rootName,typeId), out=[];
  const pcDeg={}; notes.forEach(function(n){if(pcDeg[n.pc]===undefined)pcDeg[n.pc]=n.deg;});
  const openKey=root.name.replace("\u266f","#").replace("\u266d","b")+"|"+typeId;
  const openAbs=OPEN_CHORDS[openKey]||OPEN_CHORDS[SHARP_NAMES[root.pc].replace("\u266f","#")+"|"+typeId];
  function pack(abs,title,barre){
    const labels=abs.map(function(f,i){return f===null?"":(pcDeg[mod(OPEN_MIDI[i]+f,12)]||"");});
    const colors=abs.map(function(f,i){return f===null?"":degColor(labels[i]);});
    const missing=notes.filter(function(n){return abs.every(function(f,i){return f===null||mod(OPEN_MIDI[i]+f,12)!==n.pc;});});
    out.push({abs:abs,title:title,barre:barre,labels:labels,colors:colors,missing:missing});
  }
  if(openAbs)pack(openAbs.slice(),"Open position",0);
  (SHAPES[typeId]||[]).forEach(function(sh){
    const anchor=sh[0],rel=sh[1];
    let rf=mod(root.pc-OPEN_MIDI[anchor],12);
    if(rf===0&&anchor===0&&openAbs)rf=12;
    const abs=rel.map(function(f){return f===null?null:f+rf;});
    const zeros=rel.filter(function(f){return f===0;}).length;
    const barre=(rf>0&&zeros>1)?rf:0;
    pack(abs,["Root on 6th string","Root on 5th string","Root on 4th string"][anchor],barre);
  });
  return out;
}

function scaleMap(rootName,scaleId){
  const m={}; buildScale(rootName,scaleId).forEach(function(n){ if(m[n.pc]===undefined)m[n.pc]=n; }); return m;
}
function wholeNeck(rootName,scaleId,maxFret){
  const m=scaleMap(rootName,scaleId), out=[];
  for(let s=1;s<=6;s++){
    const open=OPEN_MIDI[6-s];
    for(let f=0;f<=maxFret;f++){
      const n=m[mod(open+f,12)];
      if(n)out.push({str:s,fret:f,name:n.name,deg:n.deg});
    }
  }
  return out;
}
function positionNotes(rootName,scaleId,patIdx,nps){
  const scale=buildScale(rootName,scaleId), m=scaleMap(rootName,scaleId);
  const pcs=scale.map(function(n){return n.pc;});
  const seq=[]; for(let midi=40;midi<=88;midi++)if(pcs.indexOf(mod(midi,12))>=0)seq.push(midi);
  const rootPc=parseNote(rootName).pc;
  let i0=0; for(let k=0;k<seq.length;k++){if(mod(seq[k],12)===rootPc){i0=k;break;}}
  let i=i0+patIdx, notes=[];
  for(let s=0;s<6;s++){
    for(let j=0;j<nps;j++){
      const midi=seq[i]; if(midi===undefined)continue;
      const n=m[mod(midi,12)];
      notes.push({str:6-s,fret:midi-OPEN_MIDI[s],name:n.name,deg:n.deg});
      i++;
    }
  }
  let mn=Math.min.apply(null,notes.map(function(n){return n.fret;}));
  if(mn>12)notes.forEach(function(n){n.fret-=12;});
  mn=Math.min.apply(null,notes.map(function(n){return n.fret;}));
  if(mn<0)notes.forEach(function(n){n.fret+=12;});
  return notes;
}
function patternDiagram(notes,label,caption){
  const lo=Math.max(0,Math.min.apply(null,notes.map(function(n){return n.fret;}))-1);
  const hi=Math.max.apply(null,notes.map(function(n){return n.fret;}))+1;
  return '<div class="diagwrap"><div class="cap">'+esc(caption)+'</div>'
    +fretboardSVG(notes,{lo:lo,hi:hi,label:label,sp:56,alt:caption})+'</div>';
}
const MODE_ORDER=["Ionian","Dorian","Phrygian","Lydian","Mixolydian","Aeolian","Locrian"];
const SCALE_GROUPS=[
 ["Core",["major","natural_minor","harmonic_minor","melodic_minor"]],
 ["Modes of the major scale",["dorian","phrygian","lydian","mixolydian","locrian"]],

  h+=fretboardSVG(wholeNeck(root,sid,15),{lo:0,hi:15,label:label,sp:46,alt:"whole neck"});

function wireScalePanel(p,cfg,built,onChange){

function cagedShapes(rootName){
  const pc=parseNote(rootName).pc;
  const a=mod(pc-9,12);                   /* root fret on string 5 */
  const a2=a<3?a+12:a;                    /* C shape reaches 3 frets below the root */
  const b=a+5, c=b+2;                     /* string 6 and string 4 roots */
  const drop=function(sh){
    const f=sh.frets.filter(function(x){return x!==null;});
    if(f.length&&Math.min.apply(null,f)>=12)sh.frets=sh.frets.map(function(x){return x===null?null:x-12;});
    return sh;
  };
  return [
   {id:"C",frets:[null,a2,a2-1,a2-3,a2-2,a2-3],anchor:"5th string",note:"Open C shape. Root on string 5, doubled on string 2."},
   {id:"A",frets:[null,a,a+2,a+2,a+2,a],anchor:"5th string",note:"The A barre. Root on strings 5 and 2."},
   {id:"G",frets:[b,b-1,b-3,b-3,b-3,b],anchor:"6th string",note:"Awkward to barre, but the root sits on strings 6 and 1."},
   {id:"E",frets:[b,b+2,b+2,b+1,b,b],anchor:"6th string",note:"The E barre. Root on strings 6, 4 and 1."},
   {id:"D",frets:[null,null,c,c+2,c+3,c+2],anchor:"4th string",note:"Root on string 4, doubled on string 2."}
  ].map(drop);
}

   +'<li>String 4 \u2192 string 2: up 3 frets. Same for string 3 \u2192 string 1.</li>'
   +'<li>String 6 \u2192 string 3: up 3 frets, then two octaves is string 6 \u2192 string 1 at the same fret.</li>'
   +'<li>Twelve frets up on the same string is always the octave.</li></ul>'
   +'<h4>Fifths and fourths</h4>'
   +'<ul class="tight small" style="margin-bottom:0"><li>Perfect 5th: up one string, up 2 frets (except crossing to string 2, where it is 3 frets).</li>'
   +'<li>Perfect 4th: down one string, same fret (again, string 3 to 2 is the exception, back 1 fret).</li></ul></div>'
   +'<div class="card alt"><h4 style="margin-top:0">Reference points</h4>'
   +'<ul class="tight small"><li>Open strings low to high: E A D G B E. Intervals between them: 5, 5, 5, 4, 5 frets.</li>'
   +'<li>Fret 5 on any string equals the next open string, except string 3 where it is fret 4.</li>'
   +'<li>Fret 12 is the octave and the halfway point of the string.</li>'
   +'<li>Natural notes only repeat with a half step between B\u2013C and E\u2013F. Everywhere else there is a fret in between.</li></ul>'
   +'<p class="small muted" style="margin-bottom:0">Drill: name every '+esc(root.name)+' on the neck in under fifteen seconds, string by string. Then do the 5ths.</p></div></div>';

  h+='<h3>CAGED &mdash; five ways to play one chord</h3>'
   +'<p class="small">Every major chord can be played with five shapes derived from the open C, A, G, E and D forms. Laid end to end they cover the neck and they always appear in this order. Below: '+esc(root.name)+' major.</p>';
  h+='<div class="grid g4">';
  caged.forEach(function(sh){
    const labels=sh.frets.map(function(f,i){return f===null?"":(function(){
      const semi=mod(OPEN_MIDI[i]+f-root.pc,12);
      return semi===0?"R":semi===4?"3":semi===7?"5":"";
    })();});
    const colors=sh.frets.map(function(f,i){return f===null?"":degColor(labels[i]==="R"?"1":labels[i]==="3"?"3":labels[i]==="5"?"5":"x");});
    const played=sh.frets.filter(function(f){return f!==null&&f>0;});
    const bmin=played.length?Math.min.apply(null,played):0;
    const barre=(sh.frets.filter(function(f){return f===bmin;}).length>1)?bmin:0;
    h+='<div class="card" style="text-align:center"><div class="cap" style="font-family:var(--hand);font-size:17px">'+sh.id+' shape</div>'
     +chordBoxSVG(sh.frets,{barre:barre,labels:labels,colors:colors,alt:sh.id+" shape"})
     +'<div class="small muted">'+sh.frets.map(function(f){return f===null?"x":f;}).join(" ")+'</div>'
     +'<div class="small" style="margin-top:4px">'+sh.note+'</div>'
     +'<button class="btn" data-caged="'+sh.id+'" style="margin-top:6px">\u25b6 hear</button></div>';
  });
  h+='</div>';
  h+='<div class="card warn"><h4 style="margin-top:0">Why CAGED is worth the trouble</h4>'
   +'<ul class="tight small" style="margin-bottom:0"><li>The scale position that surrounds each shape is the one you should improvise with there. Chord shape and scale box are the same object seen two ways.</li>'
   +'<li>Minor versions come from the same idea using Am, Em and Dm forms; the C and G minor forms are rarely used because they are unplayable as barres.</li>'
   +'<li>Arpeggios, chord tones and target notes all come from knowing where the root, 3rd and 5th sit in the shape you are already holding.</li></ul></div>';

  h+='<h3>Interval reference</h3><div class="scroll"><table><thead><tr><th class="n">Semitones</th><th class="n">Symbol</th><th>Name</th><th>Sounds like</th><th class="n">Hear</th></tr></thead><tbody>';
  INTERVALS.forEach(function(iv){
    h+='<tr><td class="n">'+iv.s+'</td><td class="n"><span class="rn">'+esc(iv.short)+'</span></td><td>'+esc(iv.name)+'</td><td class="small muted">'+esc(iv.ex)+'</td>'
     +'<td class="n"><button class="btn" data-iv="'+iv.s+'">\u25b6</button></td></tr>';
  });
  h+='</tbody></table></div>';
  p.innerHTML=h;
  el("fRoot").onchange=function(){state.fbNote=this.value;render("fretboard");};
  el("fIv").onchange=function(){state.fbInterval=this.value;render("fretboard");};
  delegate(p,"[data-iv]","click",function(t){
    const base=52+mod(root.pc-52,12);
    pluck(base,0,1.4); pluck(base+ +t.dataset.iv,0.45,1.6);
  });
  delegate(p,"[data-caged]","click",function(t){
    const sh=caged.filter(function(x){return x.id===t.dataset.caged;})[0];
    sh.frets.forEach(function(f,i){if(f!==null)pluck(OPEN_MIDI[i]+f,i*0.05,2.4);});
  });
};

const LS=9;                      /* staff line spacing */
function staffLines(x0,x1,top,op){
  let o="";
  for(let i=0;i<5;i++)o+='<line x1="'+x0+'" y1="'+(top+i*LS)+'" x2="'+x1+'" y2="'+(top+i*LS)+'" stroke="var(--ink)" stroke-width="1.1" opacity="'+(op||.75)+'"/>';
  return '<g class="rough">'+o+'</g>';
}
function head(x,y,filled){
  return '<ellipse cx="'+x+'" cy="'+y+'" rx="6" ry="4.4" transform="rotate(-22 '+x+' '+y+')" fill="'+(filled?"var(--ink)":"none")+'" stroke="var(--ink)" stroke-width="1.8"/>';
}
function noteGlyph(x,y,cfg){
  cfg=cfg||{};
  let o=head(x,y,cfg.filled!==false);
  if(cfg.stem!==false){
    const up=cfg.down?false:true, sx=up?x+5.4:x-5.4, sy=up?y-32:y+32;
    o+='<line x1="'+sx+'" y1="'+y+'" x2="'+sx+'" y2="'+sy+'" stroke="var(--ink)" stroke-width="1.8"/>';
    for(let f=0;f<(cfg.flags||0);f++){
      const fy=sy+(up?f*7:-f*7);
      o+='<path d="M '+sx+' '+fy+' q 10 4 9 14" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round"/>';
    }
  }
  if(cfg.dot)o+='<circle cx="'+(x+11)+'" cy="'+(y-4)+'" r="2" fill="var(--ink)"/>';
  return o;
}
function clefG(x,top){
  /* generated spiral so it reads as drawn, not typeset */
  const gLine=top+3*LS, cx=x+13;
  let d="",pts=[];
  for(let t=0;t<=2.35*Math.PI*2;t+=0.25){
    const r=13-9*(t/(2.35*Math.PI*2));
    pts.push([cx+r*Math.cos(t+Math.PI),gLine+r*Math.sin(t+Math.PI)]);
  }
  d="M "+pts[0][0].toFixed(1)+" "+pts[0][1].toFixed(1)+pts.slice(1).map(function(p){return " L "+p[0].toFixed(1)+" "+p[1].toFixed(1);}).join("");
  let o='<g class="rough" fill="none" stroke="var(--ink)" stroke-width="2.1" stroke-linecap="round">';
  o+='<path d="'+d+'"/>';
  o+='<path d="M '+(cx-13)+' '+gLine+' C '+(cx-16)+' '+(top-14)+', '+(cx+14)+' '+(top-20)+', '+(cx+5)+' '+(top+6)+
      ' C '+(cx-4)+' '+(top+26)+', '+(cx+4)+' '+(gLine+40)+', '+(cx-6)+' '+(gLine+40)+
      ' C '+(cx-13)+' '+(gLine+40)+', '+(cx-13)+' '+(gLine+31)+', '+(cx-7)+' '+(gLine+31)+'"/>';
  o+='</g>';
  return o;
}
function accidental(kind,x,y){
  if(kind==="sharp")
    return '<g class="rough" stroke="var(--ink)" stroke-width="1.8" fill="none">'
     +'<line x1="'+(x-3)+'" y1="'+(y-9)+'" x2="'+(x-3)+'" y2="'+(y+7)+'"/><line x1="'+(x+3)+'" y1="'+(y-11)+'" x2="'+(x+3)+'" y2="'+(y+5)+'"/>'
     +'<line x1="'+(x-6)+'" y1="'+(y-2)+'" x2="'+(x+6)+'" y2="'+(y-4)+'" stroke-width="2.6"/><line x1="'+(x-6)+'" y1="'+(y+4)+'" x2="'+(x+6)+'" y2="'+(y+2)+'" stroke-width="2.6"/></g>';
  if(kind==="flat")
    return '<g class="rough" stroke="var(--ink)" stroke-width="1.8" fill="none">'
     +'<line x1="'+(x-3)+'" y1="'+(y-14)+'" x2="'+(x-3)+'" y2="'+(y+6)+'"/>'
     +'<path d="M '+(x-3)+' '+(y-2)+' C '+(x+7)+' '+(y-8)+', '+(x+7)+' '+(y+4)+', '+(x-3)+' '+(y+6)+'"/></g>';
  if(kind==="natural")
    return '<g class="rough" stroke="var(--ink)" stroke-width="1.8" fill="none">'
     +'<line x1="'+(x-4)+'" y1="'+(y-12)+'" x2="'+(x-4)+'" y2="'+(y+5)+'"/><line x1="'+(x+4)+'" y1="'+(y-5)+'" x2="'+(x+4)+'" y2="'+(y+12)+'"/>'
     +'<line x1="'+(x-4)+'" y1="'+(y-3)+'" x2="'+(x+4)+'" y2="'+(y-5)+'" stroke-width="2.4"/><line x1="'+(x-4)+'" y1="'+(y+5)+'" x2="'+(x+4)+'" y2="'+(y+3)+'" stroke-width="2.4"/></g>';
  return "";
}
function restGlyph(kind,x,top){
  const mid=top+2*LS;
  if(kind==="whole")return '<rect x="'+(x-7)+'" y="'+(top+LS)+'" width="14" height="5" fill="var(--ink)"/>';
  if(kind==="half")return '<rect x="'+(x-7)+'" y="'+(top+2*LS-5)+'" width="14" height="5" fill="var(--ink)"/>';
  if(kind==="quarter")return '<g class="rough" fill="none" stroke="var(--ink)" stroke-width="2.6" stroke-linecap="round">'
    +'<path d="M '+(x-4)+' '+(mid-14)+' l 8 8 l -8 8 l 7 7"/><path d="M '+(x+3)+' '+(mid+9)+' q -8 2 -3 9"/></g>';
  if(kind==="eighth")return '<g class="rough" stroke="var(--ink)" stroke-width="2.2" fill="none">'
    +'<line x1="'+(x+4)+'" y1="'+(mid-10)+'" x2="'+(x-3)+'" y2="'+(mid+10)+'"/>'
    +'<circle cx="'+(x-3)+'" cy="'+(mid-9)+'" r="3" fill="var(--ink)"/><path d="M '+(x-3)+' '+(mid-9)+' q 7 -1 8 1"/></g>';
  if(kind==="sixteenth")return '<g class="rough" stroke="var(--ink)" stroke-width="2.2" fill="none">'
    +'<line x1="'+(x+5)+'" y1="'+(mid-13)+'" x2="'+(x-4)+'" y2="'+(mid+12)+'"/>'
    +'<circle cx="'+(x-2)+'" cy="'+(mid-11)+'" r="3" fill="var(--ink)"/><path d="M '+(x-2)+' '+(mid-11)+' q 7 -1 8 1"/>'
    +'<circle cx="'+(x-4)+'" cy="'+(mid-2)+'" r="3" fill="var(--ink)"/><path d="M '+(x-4)+' '+(mid-2)+' q 7 -1 8 1"/></g>';
  return "";
}
function miniStaff(w,h,inner,top){
  return '<svg viewBox="0 0 '+w+' '+h+'" width="'+w+'">'+staffLines(4,w-4,top===undefined?14:top)+inner+'</svg>';
}
const NOTE_VALUES=[
 {n:"Whole note",b:4,filled:false,stem:false,flags:0,rest:"whole",count:"1 - 2 - 3 - 4"},
 {n:"Half note",b:2,filled:false,stem:true,flags:0,rest:"half",count:"1 - 2"},
 {n:"Quarter note",b:1,filled:true,stem:true,flags:0,rest:"quarter",count:"1"},
 {n:"Eighth note",b:0.5,filled:true,stem:true,flags:1,rest:"eighth",count:"1 &"},

function autoCorrelate(buf,rate){
  const SIZE=buf.length;
  let rms=0; for(let i=0;i<SIZE;i++)rms+=buf[i]*buf[i];
  rms=Math.sqrt(rms/SIZE);
  if(rms<0.012)return -1;
  let r1=0,r2=SIZE-1;
  for(let i=0;i<SIZE/2;i++)if(Math.abs(buf[i])<0.2){r1=i;break;}
  for(let i=1;i<SIZE/2;i++)if(Math.abs(buf[SIZE-i])<0.2){r2=SIZE-i;break;}
  const b=buf.slice(r1,r2), S=b.length;
  if(S<256)return -1;
  const c=new Array(S).fill(0);
  for(let i=0;i<S;i++)for(let j=0;j<S-i;j++)c[i]+=b[j]*b[j+i];
  let d=0; while(d<S-1&&c[d]>c[d+1])d++;

  for(let i=d;i<S;i++){if(c[i]>maxv){maxv=c[i];maxp=i;}}

function pivotChords(a,b){
  const out=[];
  a.chords.filter(function(c){return c.tri;}).forEach(function(c){
    const m=b.chords.filter(function(d){return d.tri&&d.pc===c.pc&&d.type===c.type;})[0];
    if(m&&!out.some(function(x){return x.name===c.name;}))out.push({name:c.name,from:c.rn,to:m.rn});
  });
  return out;
}
function modOptions(src){
  const out=[];
  KEY_PROFILES.forEach(function(dst){
    if(dst.tonicPc===src.tonicPc&&dst.minor===src.minor)return;
    const shared=dst.scalePcs.filter(function(pc){return src.scalePcs.indexOf(pc)>=0;}).length;
    const off=mod(dst.tonicPc-src.tonicPc,12);
    const note=MOD_NOTES[(src.minor?"min":"maj")+"|"+off+"|"+(dst.minor?"min":"maj")];
    out.push({dst:dst,shared:shared,off:off,note:note,
      pivots:pivotChords(src,dst),
      dom:spell(parseNote(dst.name),5,7).name+"7"});
  });
  out.sort(function(a,b){return b.shared-a.shared||a.off-b.off;});
  return out;
}

  /* capo chart */
  h+='<h3>Capo chart</h3><p class="small">Play the shape in the left column with the capo at that fret, and this is the key you are actually in.</p>';
  const shapes=[["C",0],["A",9],["G",7],["E",4],["D",2]];
  h+='<div class="scroll"><table><thead><tr><th>Shape</th>'+[0,1,2,3,4,5,6,7].map(function(f){return '<th class="n">capo '+f+'</th>';}).join("")+'</tr></thead><tbody>';
  shapes.forEach(function(s){
    h+='<tr><td class="note">'+s[0]+'</td>'+[0,1,2,3,4,5,6,7].map(function(f){
      return '<td class="n">'+SHARP_NAMES[mod(s[1]+f,12)]+'</td>';}).join("")+'</tr>';
  });
  h+='</tbody></table></div>'
   +'<p class="small muted">Reverse it to transpose: to play in '+esc(parseNote(key).name)+' with easier shapes, find '+esc(parseNote(key).name)+' in the grid and use that row\u2019s shape at that fret.</p>';

  h+='<h3>Tunings</h3><div class="scroll"><table><thead><tr><th>Tuning</th><th class="n">6 5 4 3 2 1</th><th>What it gives you</th></tr></thead><tbody>'
   +[["Standard","E A D G B E","The reference. Everything on this page assumes it."],
     ["Drop D","D A D G B E","Low D gives one-finger power chords and a heavier low end."],
     ["Half step down","E\u266d A\u266d D\u266d G\u266d B\u266d E\u266d","Same shapes, darker and slacker. Hendrix, SRV, most metal."],
     ["Double drop D","D A D G B D","Neil Young territory. Drone on both outer strings."],
     ["DADGAD","D A D G A D","Suspended, modal. Celtic and fingerstyle."],
     ["Open G","D G D G B D","Strum open for G. Keith Richards, slide blues."],
     ["Open D","D A D F\u266f A D","Strum open for D. Slide and Delta blues."],
     ["Open E","E B E G\u266f B E","Same intervals as open D, higher tension. Bottleneck slide."]
    ].map(function(t){return '<tr><td><strong>'+t[0]+'</strong></td><td class="n note">'+t[1]+'</td><td class="small">'+t[2]+'</td></tr>';}).join("")
   +'</tbody></table></div>';

  h+='<h3>Terms</h3><div class="grid g2"><div class="card"><dl class="kv small">'
   +[["Interval","Distance between two notes, measured in scale steps and quality."],
     ["Diatonic","Belonging to the current key. Non-diatonic means borrowed or chromatic."],
     ["Tonic / dominant","The 1 chord and the 5 chord. Home and the strongest pull toward home."],
     ["Voicing","Which notes of a chord you play, in what order, in which octaves."],
     ["Inversion","A chord with something other than the root in the bass."],
     ["Guide tones","The 3rd and 7th. They define chord quality and move by half steps between chords."],
     ["Tritone","Three whole steps. The interval inside every dominant 7th that creates the tension."],
     ["Enharmonic","Two names for the same pitch: F\u266f and G\u266d."],
     ["Relative minor","The minor key sharing a key signature \u2014 the 6th degree of the major."],
     ["Parallel minor","The minor key with the same root but a different key signature."]
    ].map(function(t){return '<dt>'+t[0]+'</dt><dd style="font-weight:400">'+t[1]+'</dd>';}).join("")
   +'</dl></div>'
   +'<div class="card alt tint"><h4 style="margin-top:0">A practice order that works</h4>'
   +'<ol class="tight small" style="margin-bottom:0"><li>Notes on strings 6 and 5. Everything anchors to those two.</li>'
   +'<li>Minor pentatonic box 1 in three keys, then the other four boxes.</li>'
   +'<li>The five CAGED major shapes for one chord.</li>'
   +'<li>Major scale, 3 notes per string, pattern 1 and pattern 4.</li>'
   +'<li>Triads on the top three strings, all inversions.</li>'
   +'<li>ii\u2013V\u2013I in four keys, with 7th chords.</li>'
   +'<li>Then everything else, forever.</li></ol></div></div>';
  p.innerHTML=h;
  delegate(p,"[data-prog]","click",function(t){
    const parts=t.dataset.prog.split(":"), set=parts[0]==="maj"?PROGS_MAJ:PROGS_MIN, pr=set[+parts[1]];
    pr.ch.forEach(function(c,i){
      const n=spell(parseNote(key),c[0],c[1]);
      const ns=buildChord(n.name,c[2]);
      pcsToMidis(ns.map(function(x){return x.pc;}),48).forEach(function(m,j){pluck(m,i*0.95+j*0.05,1.9);});
    });
  });
  const bp=el("bluesPlay");
  if(bp)bp.onclick=function(){
    const map={}; map[I]=[1,0]; map[IV]=[4,5]; map[V]=[5,7];
    grid.forEach(function(c,i){
      const d=map[c], n=spell(parseNote(key),d[0],d[1]);
      const ns=buildChord(n.name,"7");
      pcsToMidis(ns.map(function(x){return x.pc;}),48).forEach(function(m,j){pluck(m,i*0.62+j*0.04,1.3);});
    });
  };
};
/* ---- boot ---- */
selectTab("keys");
document.addEventListener("keydown",function(e){
  if(e.target.tagName==="SELECT"||e.target.tagName==="INPUT")return;
  if(e.key===" "&&document.querySelector("#panel-rhythm:not([hidden])")){e.preventDefault();const b=el("mPlay");if(b)b.click();}
});
</script>
</body>
</html>
